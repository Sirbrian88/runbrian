<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RunBrian Admin</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #333;
    --accent: #e8642c;
    --accent2: #f0a05a;
    --text: #f0f0f0;
    --muted: #888;
    --green: #4caf50;
    --red: #f44336;
    --radius: 12px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 80px 0;
  }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Header ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header h1 {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  header h1 span { color: var(--text); }

  .header-btns { display: flex; gap: 8px; }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Buttons ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  button {
    font-family: inherit;
    font-size: 15px;
    border: none;
    cursor: pointer;
    border-radius: 10px;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(0.96); opacity: 0.85; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    padding: 12px 20px;
    font-weight: 600;
    width: 100%;
    font-size: 16px;
    border-radius: var(--radius);
  }
  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    padding: 10px 16px;
    border: 1px solid var(--border);
  }
  .btn-sm {
    padding: 8px 14px;
    font-size: 14px;
  }
  .btn-icon {
    background: var(--surface2);
    color: var(--muted);
    padding: 8px 12px;
    font-size: 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-ai {
    background: linear-gradient(135deg, #6e3ccc, #a855f7);
    color: #fff;
    padding: 12px 20px;
    font-weight: 600;
    width: 100%;
    font-size: 15px;
    border-radius: var(--radius);
  }
  .btn-green { background: var(--green); color: #fff; }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Sections / Screens ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  .screen { padding: 20px; }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Setup / Token Screen ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  #setupScreen {
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .setup-logo {
    font-size: 48px;
    text-align: center;
  }
  .setup-title {
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    color: var(--accent);
  }
  .setup-sub {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Form elements ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  .field { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: 0.3px; text-transform: uppercase; }
  input[type="text"],
  input[type="date"],
  input[type="password"],
  input[type="number"],
  textarea,
  select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
  }
  textarea { resize: vertical; min-height: 100px; }
  input[type="file"] { display: none; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Toggle ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 10px;
  }
  .toggle-label { font-size: 15px; }
  .toggle {
    width: 50px;
    height: 28px;
    background: var(--border);
    border-radius: 14px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle::after {
    content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    background: #fff;
    border-radius: 50%;
    top: 3px;
    left: 3px;
    transition: left 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4);
  }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { left: 25px; }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Photo upload ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  .photo-area {
    background: var(--surface2);
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .photo-area:active { border-color: var(--accent); }
  .photo-area .photo-icon { font-size: 36px; margin-bottom: 8px; }
  .photo-area p { color: var(--muted); font-size: 14px; }
  .photo-preview {
    width: 100%;
    border-radius: var(--radius);
    max-height: 200px;
    object-fit: cover;
    display: none;
  }
  .photo-filename {
    font-size: 12px;
    color: var(--accent2);
    margin-top: 6px;
    word-break: break-all;
  }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Post list ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title { font-size: 18px; font-weight: 700; }

  .post-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .post-card:active { background: var(--surface2); border-color: var(--accent); }

  .post-thumb {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--surface2);
  }
  .post-thumb-placeholder {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  .post-info { flex: 1; min-width: 0; }
  .post-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .post-meta { font-size: 12px; color: var(--muted); }
  .post-cat {
    display: inline-block;
    background: rgba(232, 100, 44, 0.15);
    color: var(--accent2);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 4px;
  }
  .badge-featured {
    background: rgba(232, 100, 44, 0.3);
    color: var(--accent);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
    margin-left: 4px;
    font-weight: 700;
  }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Related posts checkboxes ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  .related-list {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    max-height: 200px;
    overflow-y: auto;
  }
  .related-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .related-item:last-child { border-bottom: none; }
  .related-item input[type="checkbox"] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .related-item label {
    font-size: 14px;
    color: var(--text);
    text-transform: none;
    letter-spacing: 0;
    cursor: pointer;
    line-height: 1.3;
  }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Toast ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface);
    color: var(--text);
    padding: 14px 24px;
    border-radius: 100px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid var(--border);
    z-index: 9999;
    transition: transform 0.3s ease;
    white-space: nowrap;
    max-width: calc(100% - 40px);
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { border-color: var(--green); color: var(--green); }
  #toast.error { border-color: var(--red); color: var(--red); }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Spinner ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Progress / status ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  .status-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    font-size: 14px;
    color: var(--muted);
  }
  .status-step {
    padding: 6px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-icon { font-size: 16px; }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Back button ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  .back-btn {
    background: none;
    color: var(--muted);
    font-size: 15px;
    padding: 0;
    border-radius: 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .back-btn:active { transform: none; opacity: 0.6; }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Divider ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 24px 0;
  }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Empty state ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Settings screen ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  .settings-row {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .settings-row strong { display: block; margin-bottom: 4px; }
  .settings-row span { color: var(--muted); font-size: 12px; word-break: break-all; }

  /* ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Success screen ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ */
  .success-screen {
    text-align: center;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: center;
  }
  .success-icon { font-size: 64px; }
  .success-title { font-size: 22px; font-weight: 700; color: var(--green); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* PIN screen */
  #pinScreen { display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:24px;padding:40px 20px; }
  .pin-logo { font-size:48px; }
  .pin-title { font-size:22px;font-weight:700;color:var(--accent); }
  .pin-dots { display:flex;gap:16px;margin:8px 0; }
  .pin-dot { width:18px;height:18px;border-radius:50%;background:var(--border);transition:background 0.15s; }
  .pin-dot.filled { background:var(--accent); }
  .pin-pad { display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:280px; }
  .pin-key { background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:22px;font-weight:600;padding:18px;border-radius:12px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background 0.1s,transform 0.1s;width:100%; }
  .pin-key:active { background:var(--accent);transform:scale(0.93); }
  .pin-error { color:var(--red);font-size:14px;min-height:20px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
// ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Constants ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½
const REPO_OWNER = 'Sirbrian88';
const REPO_NAME  = 'runbrian';
const BRANCH     = 'main';
const API_BASE   = 'https://api.github.com';
const RAW_BASE   = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}`;

// ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ State ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½
let state = {
  screen: 'loading',   // loading | setup | list | form | settings | success
  token: localStorage.getItem('gh_token') || '',
  anthropicKey: localStorage.getItem('anthropic_key') || '',
  posts: [],
  editingPost: null,   // null = new, object = existing
  lastPublishedUrl: '',
};

// Form data
let form = {};
let photoFile = null;
let photoBase64 = null;
let photoFiles = [];
let photoBases = [];

// ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Utilities ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½
function toast(msg, type = '', duration = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.className = ''; }, duration);
}

function slugify(str) {
  return str.toLowerCase()
    .replace(/[^a-z0-9\s-]/g, '')
    .trim()
    .replace(/\s+/g, '-')
    .slice(0, 60);
}

function estimateReadTime(body) {
  if (!body) return 3;
  const words = body.trim().split(/\s+/).length;
  return Math.max(1, Math.ceil(words / 200));
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function today() {
  return new Date().toISOString().split('T')[0];
}

// ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ GitHub API ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½
async function ghFetch(path, opts = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...opts,
    headers: {
      'Authorization': `Bearer ${state.token}`,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `GitHub API error ${res.status}`);
  }
  return res.json();
}

async function fetchPosts() {
  try {
    const data = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/posts.json`);
    const json = atob(data.content.replace(/\n/g, ''));
    return { posts: JSON.parse(json), sha: data.sha };
  } catch (e) {
    throw new Error('Could not load posts.json: ' + e.message);
  }
}

async function uploadFile(filename, base64content, sha = null) {
  const body = {
    message: `Upload image: ${filename}`,
    content: base64content,
    branch: BRANCH,
  };
  if (sha) body.sha = sha;

  // Check if file exists first
  try {
    const existing = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filename}`);
    body.sha = existing.sha;
    body.message = `Update image: ${filename}`;
  } catch (e) { /* file doesn't exist yet, that's fine */ }

  return ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filename}`, {
    method: 'PUT',
    body: JSON.stringify(body),
  });
}

async function savePostsJson(posts, sha) {
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2))));
  return ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/posts.json`, {
    method: 'PUT',
    body: JSON.stringify({
      message: 'Update posts.json via admin panel',
      content,
      sha,
      branch: BRANCH,
    }),
  });
}

async function expandWithAI(excerpt, notes, title, category) {
  if (!state.anthropicKey) {
    toast('No Anthropic API key set. Go to Settings.', 'error');
    return null;
  }

  const prompt = `Title: ${title}
Category: ${category}
Excerpt: ${excerpt}
Notes/Draft: ${notes}

Please expand these notes into a vivid, personal, first-person blog post body. Aim for 300-500 words.`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': state.anthropicKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
      'content-type': 'application/json',
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 1024,
      system: "You are helping Brian Hamilton write blog posts about ultrarunning and outdoor adventures. Expand the notes into a vivid, personal, first-person narrative. Keep Brian's voice ï¿½ï¿½ï¿½ direct, honest, self-deprecating.",
      messages: [{ role: 'user', content: prompt }],
    }),
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `Anthropic API error ${res.status}`);
  }

  const data = await res.json();
  return data.content?.[0]?.text || null;
}

// ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Event Attachment ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½
function attachEvents() {
  const $ = id => document.getElementById(id);


  // PIN screen
  let pinEntry = '';
  document.querySelectorAll('.pin-key[data-digit]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (pinEntry.length >= 4) return;
      pinEntry += btn.dataset.digit;
      for (let i = 0; i < 4; i++) { const d = document.getElementById('d'+i); if(d) d.classList.toggle('filled', i < pinEntry.length); }
      if (pinEntry.length === 4) {
        if (pinEntry === '1690') {
          sessionStorage.setItem('unlocked','1');
          if (!state.token) { state.screen = 'setup'; render(); } else { loadAndShowList(); }
        } else {
          const err = document.getElementById('pinError');
          if(err) err.textContent = 'Wrong PIN, try again';
          setTimeout(() => { pinEntry=''; for(let i=0;i<4;i++){const d=document.getElementById('d'+i);if(d)d.classList.remove('filled');} if(err)err.textContent=''; }, 800);
        }
      }
    });
  });
  const pinDel = $('pinDel');
  if (pinDel) { pinDel.addEventListener('click', () => { if(pinEntry.length>0){pinEntry=pinEntry.slice(0,-1); for(let i=0;i<4;i++){const d=document.getElementById('d'+i);if(d)d.classList.toggle('filled',i<pinEntry.length);}} }); }

  // Setup screen
  const saveSetupBtn = $('saveSetupBtn');
  if (saveSetupBtn) {
    saveSetupBtn.addEventListener('click', () => {
      const token = $('tokenInput').value.trim();
      const akey = $('anthropicInput').value.trim();
      if (!token) { toast('Please enter your GitHub token', 'error'); return; }
      state.token = token;
      state.anthropicKey = akey;
      localStorage.setItem('gh_token', token);
      if (akey) localStorage.setItem('anthropic_key', akey);
      loadAndShowList();
    });
  }

  // Settings screen
  const saveSettingsBtn = $('saveSettingsBtn');
  if (saveSettingsBtn) {
    saveSettingsBtn.addEventListener('click', () => {
      const token = $('tokenInput').value.trim();
      const akey = $('anthropicInput').value.trim();
      if (token) { state.token = token; localStorage.setItem('gh_token', token); }
      if (akey) { state.anthropicKey = akey; localStorage.setItem('anthropic_key', akey); }
      toast('Saved!', 'success');
    });
  }

  const clearCredsBtn = $('clearCredsBtn');
  if (clearCredsBtn) {
    clearCredsBtn.addEventListener('click', () => {
      if (!confirm('Clear all credentials and start over?')) return;
      localStorage.clear();
      state.token = '';
      state.anthropicKey = '';
      state.screen = 'setup';
      render();
    });
  }

  // List screen
  const settingsBtn = $('settingsBtn');
  if (settingsBtn) {
    settingsBtn.addEventListener('click', () => { state.screen = 'settings'; render(); });
  }

  const newPostBtn = $('newPostBtn');
  if (newPostBtn) {
    newPostBtn.addEventListener('click', () => {
      state.editingPost = null;
      photoFile = null;
      photoBase64 = null;
      photoFiles = [];
      photoBases = [];
      state.screen = 'form';
      render();
    });
  }

  const refreshBtn = $('refreshBtn');
  if (refreshBtn) {
    refreshBtn.addEventListener('click', () => loadAndShowList());
  }

  // Post cards
  document.querySelectorAll('.post-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      const post = state.posts.find(p => p.id === id);
      if (post) {
        state.editingPost = post;
        photoFile = null;
        photoBase64 = null;
        state.screen = 'form';
        render();
      }
    });
  });

  // Form screen
  const backBtn = $('backBtn');
  if (backBtn) {
    backBtn.addEventListener('click', () => {
      state.screen = state.screen === 'settings' ? 'list' : 'list';
      render();
    });
  }

  const deleteBtn = $('deleteBtn');
  if (deleteBtn) {
    deleteBtn.addEventListener('click', handleDelete);
  }

  // Photo upload
  const photoArea = $('photoArea');
  const photoInput = $('photoInput');
  if (photoArea && photoInput) {
    photoArea.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', handlePhotoSelect);
  }

  // Featured toggle
  const featuredToggle = $('featuredToggle');
  if (featuredToggle) {
    featuredToggle.addEventListener('click', () => {
      featuredToggle.classList.toggle('on');
    });
  }

  // AI expand
  const aiExpandBtn = $('aiExpandBtn');
  if (aiExpandBtn) {
    aiExpandBtn.addEventListener('click', handleAIExpand);
  }

  // Auto-update read time when body changes
  const fBody = $('fBody');
  if (fBody) {
    fBody.addEventListener('input', () => {
      const rt = $('fReadTime');
      if (rt && !rt.dataset.edited) {
        rt.value = estimateReadTime(fBody.value);
      }
    });
    const rt = $('fReadTime');
    if (rt) {
      rt.addEventListener('input', () => { rt.dataset.edited = 'true'; });
    }
  }

  // Publish
  const publishBtn = $('publishBtn');
  if (publishBtn) {
    publishBtn.addEventListener('click', handlePublish);
  }

  // Success screen
  const backToListBtn = $('backToListBtn');
  if (backToListBtn) {
    backToListBtn.addEventListener('click', () => loadAndShowList());
  }
}

// ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Handlers ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½
function handlePhotoSelect(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  photoFile = file;

  const reader = new FileReader();
  reader.onload = ev => {
    const result = ev.target.result; // data:image/jpeg;base64,...
    photoBase64 = result.split(',')[1];

    const preview = document.getElementById('photoPreview');
    const filename = document.getElementById('photoFilename');
    const area = document.getElementById('photoArea');
    if (preview) { preview.src = result; preview.style.display = 'block'; }
    if (area) area.style.display = 'none';
    if (filename) filename.textContent = `ï¿½ï¿½ï¿½ï¿½ ${file.name} (${(file.size/1024).toFixed(0)} KB)`;
  };
  reader.readAsDataURL(file);
}

async function handleAIExpand() {
  const title = document.getElementById('fTitle')?.value || '';
  const category = document.getElementById('fCategory')?.value || '';
  const excerpt = document.getElementById('fExcerpt')?.value || '';
  const body = document.getElementById('fBody')?.value || '';

  if (!excerpt && !body) {
    toast('Add an excerpt or some notes first', 'error');
    return;
  }

  const btn = document.getElementById('aiExpandBtn');
  btn.innerHTML = '<span class="spinner"></span>Expandingï¿½ï¿½ï¿½';
  btn.disabled = true;

  try {
    const expanded = await expandWithAI(excerpt, body, title, category);
    if (expanded) {
      document.getElementById('fBody').value = expanded;
      document.getElementById('fReadTime').value = estimateReadTime(expanded);
      toast('ï¿½ï¿½ï¿½ AI expansion complete!', 'success');
    }
  } catch (e) {
    toast('AI error: ' + e.message, 'error');
  } finally {
    btn.innerHTML = 'ï¿½ï¿½ï¿½ Expand with AI';
    btn.disabled = false;
  }
}

async function handlePublish() {
  const title = document.getElementById('fTitle')?.value?.trim();
  const category = document.getElementById('fCategory')?.value?.trim();
  const date = document.getElementById('fDate')?.value?.trim();
  const excerpt = document.getElementById('fExcerpt')?.value?.trim();
  const body = document.getElementById('fBody')?.value?.trim();
  const readTimeVal = document.getElementById('fReadTime')?.value;
  const isFeatured = document.getElementById('featuredToggle')?.classList.contains('on');

  if (!title) { toast('Title is required', 'error'); return; }

  // Gather related
  const relatedIds = [];
  document.querySelectorAll('.related-item input[type="checkbox"]:checked').forEach(cb => {
    relatedIds.push(cb.value);
  });

  // Status UI
  const statusBox = document.getElementById('publishStatus');
  const publishBtn = document.getElementById('publishBtn');
  statusBox.style.display = 'block';
  publishBtn.disabled = true;
  publishBtn.innerHTML = '<span class="spinner"></span>Publishingï¿½ï¿½ï¿½';

  function setStatus(steps) {
    statusBox.innerHTML = `<div class="status-box">${steps.map(s =>
      `<div class="status-step"><span class="step-icon">${s.icon}</span> ${s.text}</div>`
    ).join('')}</div>`;
  }

  const steps = [
    { icon: 'ï¿½ï¿½ï¿½', text: 'Uploading imageï¿½ï¿½ï¿½' },
    { icon: 'ï¿½ï¿½ï¿½', text: 'Updating posts.jsonï¿½ï¿½ï¿½' },
  ];

  try {
    let imageName = state.editingPost?.image || '';

    // Step 1: Upload image if new file selected
    if (photoFile && photoBase64) {
      setStatus([{ icon: 'ï¿½ï¿½ï¿½ï¿½', text: 'Uploading imageï¿½ï¿½ï¿½' }, { icon: 'ï¿½ï¿½ï¿½', text: 'Updating posts.jsonï¿½ï¿½ï¿½' }]);
      imageName = photoFile.name;
      await uploadFile(imageName, photoBase64);
    }

    // Step 2: Fetch current posts.json
    setStatus([{ icon: 'ï¿½ï¿½ï¿½', text: 'Image uploaded' }, { icon: 'ï¿½ï¿½ï¿½ï¿½', text: 'Fetching posts.jsonï¿½ï¿½ï¿½' }]);
    const { posts, sha } = await fetchPosts();

    // Step 3: Build post object
    const readTime = readTimeVal ? parseInt(readTimeVal) : estimateReadTime(body);
    const isEdit = !!state.editingPost;

    const postObj = {
      id: isEdit ? state.editingPost.id : genId(),
      category: category || 'Uncategorized',
      title,
      excerpt: excerpt || '',
      image: imageName || '',
      images: imageNames.length > 0 ? imageNames : (imageName ? [imageName] : []),
      date: date || today(),
      readTime,
      featured: isFeatured,
      body: body || '',
    };

    if (relatedIds.length > 0) postObj.related = relatedIds;

    let updatedPosts;
    if (isEdit) {
      // Replace in place
      const idx = posts.findIndex(p => p.id === postObj.id);
      if (idx >= 0) {
        updatedPosts = [...posts];
        updatedPosts[idx] = postObj;
      } else {
        updatedPosts = [postObj, ...posts];
      }
    } else {
      // Prepend new
      updatedPosts = [postObj, ...posts];
    }

    // Step 4: Save posts.json
    setStatus([{ icon: 'ï¿½ï¿½ï¿½', text: 'Image uploaded' }, { icon: 'ï¿½ï¿½ï¿½ï¿½', text: 'Saving posts.jsonï¿½ï¿½ï¿½' }]);
    await savePostsJson(updatedPosts, sha);

    setStatus([{ icon: 'ï¿½ï¿½ï¿½', text: 'Image uploaded' }, { icon: 'ï¿½ï¿½ï¿½', text: 'posts.json updated' }]);

    // Update local state
    state.posts = updatedPosts;
    state.screen = 'success';
    render();

  } catch (e) {
    toast('Error: ' + e.message, 'error', 5000);
    publishBtn.disabled = false;
    publishBtn.innerHTML = `ï¿½ï¿½ï¿½ï¿½ ${state.editingPost ? 'Update Post' : 'Publish Post'}`;
    setStatus([{ icon: 'ï¿½ï¿½ï¿½', text: e.message }]);
  }
}

async function handleDelete() {
  const post = state.editingPost;
  if (!post) return;
  if (!confirm(`Delete "${post.title}"? This cannot be undone.`)) return;

  try {
    const { posts, sha } = await fetchPosts();
    const updated = posts.filter(p => p.id !== post.id);
    await savePostsJson(updated, sha);
    state.posts = updated;
    state.editingPost = null;
    state.screen = 'list';
    render();
    toast('Post deleted', 'success');
  } catch (e) {
    toast('Delete failed: ' + e.message, 'error');
  }
}

// ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ Init ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½ï¿½
async function loadAndShowList() {
  state.screen = 'loading';
  render();
  try {
    const { posts } = await fetchPosts();
    state.posts = posts;
    state.screen = 'list';
  } catch (e) {
    toast('Failed to load posts: ' + e.message, 'error', 5000);
    state.screen = 'list';
    state.posts = [];
  }
  render();
}

async function init() {
  // Read keys from URL hash if present (e.g. #t=TOKEN&a=ANTHROPIC_KEY)
  // This lets you bookmark a URL with keys pre-loaded without embedding them in source
  if (location.hash) {
    const params = new URLSearchParams(location.hash.slice(1));
    if (params.get('t')) { state.token = params.get('t'); localStorage.setItem('gh_token', state.token); }
    if (params.get('a')) { state.anthropicKey = params.get('a'); localStorage.setItem('anthropic_key', state.anthropicKey); }
    // Clear hash from URL so keys aren't visible in address bar after load
    history.replaceState(null, '', location.pathname);
  }

  if (!sessionStorage.getItem('unlocked')) {
    state.screen = 'pin';
    render();
    return;
  }
  if (!state.token) {
    state.screen = 'setup';
    render();
  } else {
    await loadAndShowList();
  }
}

init();
</script>
