<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RunBrian Admin</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #242424;
  --border: #333; --accent: #e8642c; --accent2: #f0a05a;
  --text: #f0f0f0; --muted: #888; --green: #4caf50; --red: #f44336; --radius: 12px;
}
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:16px; line-height:1.5; min-height:100vh; }
#app { max-width:480px; margin:0 auto; padding:0 0 80px; }

/* Header */
header { background:var(--surface); border-bottom:1px solid var(--border); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
header h1 { font-size:20px; font-weight:700; color:var(--accent); letter-spacing:-0.5px; }
header h1 span { color:var(--text); }
.header-btns { display:flex; gap:8px; }

/* Buttons */
button { font-family:inherit; font-size:15px; border:none; cursor:pointer; border-radius:10px; transition:opacity .15s,transform .1s; -webkit-tap-highlight-color:transparent; }
button:active { transform:scale(.96); opacity:.85; }
.btn-primary { background:var(--accent); color:#fff; padding:12px 20px; font-weight:600; width:100%; font-size:16px; border-radius:var(--radius); }
.btn-secondary { background:var(--surface2); color:var(--text); padding:10px 16px; border:1px solid var(--border); }
.btn-sm { padding:8px 14px; font-size:14px; }
.btn-icon { background:var(--surface2); color:var(--muted); padding:8px 12px; font-size:18px; border-radius:10px; border:1px solid var(--border); }
.btn-danger { background:var(--red); color:#fff; }
.btn-ai { background:linear-gradient(135deg,#6e3ccc,#a855f7); color:#fff; padding:12px 20px; font-weight:600; width:100%; font-size:15px; border-radius:var(--radius); }

/* Screens */
.screen { padding:20px; }

/* PIN screen */
#pinScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; gap:24px; padding:40px 20px; }
.pin-logo { font-size:48px; }
.pin-title { font-size:22px; font-weight:700; color:var(--accent); }
.pin-dots { display:flex; gap:16px; margin:8px 0; }
.pin-dot { width:18px; height:18px; border-radius:50%; background:var(--border); transition:background .15s; }
.pin-dot.filled { background:var(--accent); }
.pin-pad { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; width:100%; max-width:280px; }
.pin-key { background:var(--surface2); border:1px solid var(--border); color:var(--text); font-size:22px; font-weight:600; padding:18px; border-radius:12px; text-align:center; cursor:pointer; -webkit-tap-highlight-color:transparent; transition:background .1s,transform .1s; width:100%; }
.pin-key:active { background:var(--accent); transform:scale(.93); }
.pin-error { color:var(--red); font-size:14px; min-height:20px; }

/* Setup screen */
#setupScreen { padding:40px 20px; display:flex; flex-direction:column; gap:20px; }
.setup-logo { font-size:48px; text-align:center; }
.setup-title { text-align:center; font-size:24px; font-weight:700; color:var(--accent); }
.setup-sub { text-align:center; color:var(--muted); font-size:14px; line-height:1.6; }

/* Form */
.field { display:flex; flex-direction:column; gap:6px; }
label { font-size:13px; color:var(--muted); font-weight:500; letter-spacing:.3px; text-transform:uppercase; }
input[type=text], input[type=password], input[type=number], textarea, select {
  background:var(--surface2); border:1px solid var(--border); color:var(--text);
  font-family:inherit; font-size:16px; padding:12px 14px; border-radius:10px;
  width:100%; outline:none; transition:border-color .15s; -webkit-appearance:none;
}
input:focus, textarea:focus, select:focus { border-color:var(--accent); }
textarea { resize:vertical; min-height:100px; }
input[type=file] { display:none; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* Toggle */
.toggle-row { display:flex; align-items:center; justify-content:space-between; background:var(--surface2); border:1px solid var(--border); padding:14px; border-radius:10px; }
.toggle-label { font-size:15px; }
.toggle { width:50px; height:28px; background:var(--border); border-radius:14px; position:relative; cursor:pointer; transition:background .2s; flex-shrink:0; }
.toggle::after { content:''; position:absolute; width:22px; height:22px; background:#fff; border-radius:50%; top:3px; left:3px; transition:left .2s; box-shadow:0 1px 4px rgba(0,0,0,.4); }
.toggle.on { background:var(--accent); }
.toggle.on::after { left:25px; }

/* Photo upload */
.photo-area { background:var(--surface2); border:2px dashed var(--border); border-radius:var(--radius); padding:20px; text-align:center; cursor:pointer; transition:border-color .2s; }
.photo-area:active { border-color:var(--accent); }
.photo-area .photo-icon { font-size:28px; margin-bottom:6px; }
.photo-area p { color:var(--muted); font-size:13px; }
.photo-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
.photo-thumb-wrap { position:relative; border-radius:8px; overflow:hidden; aspect-ratio:1; background:var(--surface2); }
.photo-thumb-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
.photo-thumb-wrap .photo-del { position:absolute; top:4px; right:4px; background:rgba(244,67,54,0.9); color:#fff; border:none; border-radius:50%; width:22px; height:22px; font-size:14px; line-height:22px; text-align:center; cursor:pointer; padding:0; }
.photo-thumb-wrap .photo-label { position:absolute; top:0; left:0; right:0; background:rgba(0,0,0,0.65); color:#fff; font-size:10px; font-weight:600; text-align:center; padding:3px; font-family:sans-serif; border-radius:8px 8px 0 0; }
.photo-add-btn { background:var(--surface2); border:1px dashed var(--border); border-radius:8px; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); font-size:24px; transition:border-color .2s; }
.photo-add-btn:active { border-color:var(--accent); }
.photo-thumb-wrap.is-cover { outline:2px solid var(--accent); outline-offset:-2px; }
.focal-row { display:flex; align-items:center; gap:10px; margin-top:8px; }
.focal-label { font-size:12px; color:var(--muted); white-space:nowrap; }
.focal-select { background:var(--surface2); border:1px solid var(--border); color:var(--text); font-size:13px; padding:6px 10px; border-radius:8px; flex:1; }

/* Post list */
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.section-title { font-size:18px; font-weight:700; }
.post-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; cursor:pointer; transition:border-color .15s,background .15s; display:flex; gap:12px; align-items:flex-start; }
.post-card:active { background:var(--surface2); border-color:var(--accent); }
.post-thumb { width:64px; height:64px; border-radius:8px; object-fit:cover; flex-shrink:0; background:var(--surface2); }
.post-thumb-placeholder { width:64px; height:64px; border-radius:8px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
.post-info { flex:1; min-width:0; }
.post-title { font-size:15px; font-weight:600; line-height:1.3; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.post-meta { font-size:12px; color:var(--muted); }
.post-cat { display:inline-block; background:rgba(232,100,44,.15); color:var(--accent2); font-size:11px; padding:2px 8px; border-radius:20px; margin-bottom:4px; }
.badge-featured { background:rgba(232,100,44,.3); color:var(--accent); font-size:10px; padding:2px 6px; border-radius:10px; margin-left:4px; font-weight:700; }

/* Related posts */
.related-list { background:var(--surface2); border:1px solid var(--border); border-radius:10px; max-height:200px; overflow-y:auto; }
.related-item { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--border); cursor:pointer; }
.related-item:last-child { border-bottom:none; }
.related-item input[type=checkbox] { width:20px; height:20px; accent-color:var(--accent); flex-shrink:0; }
.related-item label { font-size:14px; color:var(--text); text-transform:none; letter-spacing:0; cursor:pointer; line-height:1.3; }

/* Training */
.train-status { font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; white-space:nowrap; margin-left:6px; }
.train-status.today { background:rgba(232,100,44,.3); color:var(--accent); }
.train-status.done { background:rgba(76,175,80,.2); color:var(--green); }
.train-status.nolog { background:rgba(240,160,90,.2); color:var(--accent2); }
.strava-chip { display:flex; align-items:center; gap:10px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
.strava-chip-info { flex:1; min-width:0; }
.strava-chip-name { font-size:14px; font-weight:600; }
.strava-chip-stats { font-size:12px; color:var(--muted); margin-top:2px; }
.strava-chip-remove { background:none; border:none; color:var(--red); font-size:18px; cursor:pointer; padding:4px 8px; line-height:1; }
.import-day-preview { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:8px; }
.import-day-preview .idp-date { font-weight:700; font-size:14px; color:var(--accent2); }
.import-day-preview .idp-plan { font-size:13px; color:var(--muted); margin-top:4px; white-space:pre-line; }

/* Toast */
#toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--surface); color:var(--text); padding:14px 24px; border-radius:100px; font-size:14px; font-weight:500; border:1px solid var(--border); z-index:9999; transition:transform .3s ease; white-space:nowrap; max-width:calc(100% - 40px); text-align:center; box-shadow:0 4px 24px rgba(0,0,0,.5); }
#toast.show { transform:translateX(-50%) translateY(0); }
#toast.success { border-color:var(--green); color:var(--green); }
#toast.error { border-color:var(--red); color:var(--red); }

/* Spinner */
.spinner { display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Status */
.status-box { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:16px; font-size:14px; color:var(--muted); }
.status-step { padding:6px 0; display:flex; align-items:center; gap:8px; }

/* Back button */
.back-btn { background:none; color:var(--muted); font-size:15px; padding:0; border-radius:0; display:flex; align-items:center; gap:4px; }
.back-btn:active { transform:none; opacity:.6; }

/* Divider */
.divider { height:1px; background:var(--border); margin:24px 0; }

/* Empty */
.empty { text-align:center; padding:60px 20px; color:var(--muted); font-size:14px; }
.empty-icon { font-size:48px; margin-bottom:12px; }

/* Settings */
.settings-row { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:10px; font-size:14px; }
.settings-row strong { display:block; margin-bottom:4px; }
.settings-row span { color:var(--muted); font-size:12px; word-break:break-all; }

/* Success */
.success-screen { text-align:center; padding:40px 20px; display:flex; flex-direction:column; gap:16px; align-items:center; }
.success-icon { font-size:64px; }
.success-title { font-size:22px; font-weight:700; color:var(--green); }

::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

/* Video list */
.video-row { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.video-input-row { display:flex; gap:8px; align-items:center; }
.video-input-row input { flex:1; }
.video-del-btn { background:var(--red); color:#fff; border:none; border-radius:8px; width:36px; height:44px; font-size:18px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
.video-preview { border-radius:8px; overflow:hidden; margin-top:4px; background:var(--surface2); }
.video-preview iframe { display:block; width:100%; border:none; }
.video-preview.shorts { max-width:200px; }
.add-video-btn { background:var(--surface2); border:1px dashed var(--border); color:var(--accent2); border-radius:10px; padding:10px; font-size:14px; cursor:pointer; width:100%; text-align:center; margin-top:4px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const REPO_OWNER = 'Sirbrian88';
const REPO_NAME  = 'runbrian';
const BRANCH     = 'main';
const API_BASE   = 'https://api.github.com';
const RAW_BASE   = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}`;

let state = {
  screen: 'loading',
  token: localStorage.getItem('gh_token') || '',
  anthropicKey: localStorage.getItem('anthropic_key') || '',
  posts: [], editingPost: null,
  trainingDays: [], editingTrainingDay: null, importParsed: [], importRawText: '',
};

let photoFiles = [];
let photoBases = [];

// ─── Utilities ───
function toast(msg, type='', dur=3000) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `show ${type}`;
  clearTimeout(el._t); el._t = setTimeout(() => el.className='', dur);
}
function estimateReadTime(body) {
  if (!body) return 3;
  return Math.max(1, Math.ceil(body.trim().split(/\s+/).length / 200));
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function today() { return new Date().toISOString().split('T')[0]; }
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─── GitHub API ───
async function ghFetch(path, opts={}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...opts,
    headers: { 'Authorization':`Bearer ${state.token}`, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json', ...(opts.headers||{}) },
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.message||`GitHub ${res.status}`); }
  return res.json();
}
async function fetchPosts() {
  const data = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/posts.json`);
  const json = new TextDecoder().decode(Uint8Array.from(atob(data.content.replace(/\n/g,'')), c=>c.charCodeAt(0)));
  return { posts: JSON.parse(json), sha: data.sha };
}
async function uploadFile(filename, b64) {
  const body = { message:`Upload: ${filename}`, content:b64, branch:BRANCH };
  try { const ex = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filename}`); body.sha=ex.sha; body.message=`Update: ${filename}`; } catch(e){}
  return ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filename}`, { method:'PUT', body:JSON.stringify(body) });
}
async function savePostsJson(posts, sha) {
  const enc = new TextEncoder().encode(JSON.stringify(posts, null, 2));
  let b=''; for (let i=0;i<enc.length;i+=8192) b+=String.fromCharCode(...enc.slice(i,i+8192));
  return ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/posts.json`, {
    method:'PUT',
    body:JSON.stringify({ message:'Update posts.json via admin', content:btoa(b), sha, branch:BRANCH }),
  });
}

async function fetchTraining() {
  const data = await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/training.json`);
  const json = new TextDecoder().decode(Uint8Array.from(atob(data.content.replace(/\n/g,'')), c=>c.charCodeAt(0)));
  return { days: JSON.parse(json), sha: data.sha };
}
async function saveTrainingJson(days, sha) {
  const enc = new TextEncoder().encode(JSON.stringify(days, null, 2));
  let b=''; for (let i=0;i<enc.length;i+=8192) b+=String.fromCharCode(...enc.slice(i,i+8192));
  return ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/training.json`, {
    method:'PUT',
    body:JSON.stringify({ message:'Update training.json via admin', content:btoa(b), sha, branch:BRANCH }),
  });
}

// ─── AI Expand ───
async function expandWithAI(excerpt, notes, title, category) {
  if (!state.anthropicKey) { toast('No Anthropic key — go to Settings', 'error'); return null; }
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers: { 'x-api-key':state.anthropicKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true', 'content-type':'application/json' },
    body: JSON.stringify({
      model:'claude-haiku-4-5-20251001', max_tokens:1024,
      system:"You are helping Brian Hamilton write blog posts about ultrarunning and outdoor adventures. Expand the notes into a vivid, personal, first-person narrative. Keep Brian's voice — direct, honest, self-deprecating.",
      messages:[{ role:'user', content:`Title: ${title}\nCategory: ${category}\nExcerpt: ${excerpt}\nNotes: ${notes}\n\nExpand into a vivid 300-500 word blog post body.` }],
    }),
  });
  if (!res.ok) { const e=await res.json().catch(()=>({})); throw new Error(e.error?.message||`Anthropic ${res.status}`); }
  const d = await res.json();
  return d.content?.[0]?.text || null;
}

// ─── Video helpers ───
let videoRowCount = 0;

function getYouTubeId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([^&?/]+)/);
  return m ? m[1] : null;
}

function isShorts(url) { return url && url.includes('/shorts/'); }

function buildVideoRowHTML(url, idx) {
  videoRowCount = Math.max(videoRowCount, idx + 1);
  const id = getYouTubeId(url);
  const previewHTML = id ? buildVideoPreviewHTML(url, id) : '';
  return `<div class="video-row" id="vrow-${idx}">
    <div class="video-input-row">
      <input type="text" class="video-url-input" data-idx="${idx}" value="${escHtml(url)}"
        placeholder="https://youtube.com/watch?v=... or /shorts/..."
        oninput="updateVideoPreview(this)">
      <button type="button" class="video-del-btn" onclick="removeVideoRow(${idx})">&#x00D7;</button>
    </div>
    <div class="video-preview ${isShorts(url)?'shorts':''}" id="vpreview-${idx}">${previewHTML}</div>
  </div>`;
}

function buildVideoPreviewHTML(url, id) {
  const shorts = isShorts(url);
  if (shorts) {
    return `<iframe src="https://www.youtube.com/embed/${id}" height="280" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  }
  return `<iframe src="https://www.youtube.com/embed/${id}" height="200" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
}

function updateVideoPreview(input) {
  const idx = input.dataset.idx;
  const preview = document.getElementById('vpreview-' + idx);
  if (!preview) return;
  const id = getYouTubeId(input.value);
  if (id) {
    preview.innerHTML = buildVideoPreviewHTML(input.value, id);
    preview.className = 'video-preview' + (isShorts(input.value) ? ' shorts' : '');
  } else {
    preview.innerHTML = '';
  }
}

function addVideoRow() {
  const list = document.getElementById('videoList');
  if (!list) return;
  const div = document.createElement('div');
  div.innerHTML = buildVideoRowHTML('', videoRowCount++);
  list.appendChild(div.firstElementChild);
}

function removeVideoRow(idx) {
  const row = document.getElementById('vrow-' + idx);
  if (row) row.remove();
  // Keep at least one empty row
  const list = document.getElementById('videoList');
  if (list && list.querySelectorAll('.video-row').length === 0) {
    const div = document.createElement('div');
    div.innerHTML = buildVideoRowHTML('', videoRowCount++);
    list.appendChild(div.firstElementChild);
  }
}

function getVideoUrls() {
  return Array.from(document.querySelectorAll('.video-url-input'))
    .map(i => i.value.trim())
    .filter(Boolean);
}

// ─── Category helpers ───
const DEFAULT_CATS = ['Ultra Running','Aviation','Beekeeping','Home Automation','Weimaraners','Food & Wine','Travel'];

function getCategories() {
  const fromPosts = state.posts.map(p => (p.category||'').split('·')[0].trim()).filter(Boolean);
  const saved = JSON.parse(localStorage.getItem('extra_cats')||'[]');
  return [...new Set([...DEFAULT_CATS, ...fromPosts, ...saved])].sort();
}

function saveNewCategory(cat) {
  const saved = JSON.parse(localStorage.getItem('extra_cats')||'[]');
  if (!saved.includes(cat)) { saved.push(cat); localStorage.setItem('extra_cats', JSON.stringify(saved)); }
}

function renderCategorySelect(current) {
  const cats = getCategories();
  const opts = cats.map(c => `<option value="${escHtml(c)}" ${c===current?'selected':''}>${escHtml(c)}</option>`).join('');
  return `<select id="fCategory" onchange="handleCatChange(this.value)">
    <option value="">Select category&hellip;</option>
    ${opts}
    <option value="__new__">+ Add New Category&hellip;</option>
  </select>`;
}

// ─── Training: schedule text parser ───
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const SCHEDULE_HEADER_RE = /^(Sunday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday)\s*(?:(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2})(?:st|nd|rd|th)?)?\s*:\s*(.*)$/i;

function parseScheduleText(raw) {
  const text = (raw||'').replace(/\r\n/g,'\n').trim();
  if (!text) return [];
  const blocks = text.split(/\n\s*\n+/);
  const results = [];
  let lastDate = null;
  for (const block of blocks) {
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    if (!lines.length) continue;
    const m = lines[0].match(SCHEDULE_HEADER_RE);
    if (!m) continue;
    const dayNameRaw = m[1], monthName = m[2], dayNum = m[3], restFirst = m[4];
    const dayName = dayNameRaw.charAt(0).toUpperCase() + dayNameRaw.slice(1).toLowerCase();
    let date;
    if (monthName && dayNum) {
      const year = lastDate ? lastDate.getFullYear() : new Date().getFullYear();
      const monthIdx = MONTH_NAMES.findIndex(mn=>mn.toLowerCase()===monthName.toLowerCase());
      date = new Date(year, monthIdx, parseInt(dayNum,10));
      if (lastDate && date < lastDate && (lastDate - date) > 300*86400000) {
        date = new Date(year+1, monthIdx, parseInt(dayNum,10));
      }
    } else if (lastDate) {
      date = new Date(lastDate);
      date.setDate(date.getDate()+1);
    } else {
      const t = new Date(); t.setHours(0,0,0,0);
      const targetIdx = DAY_NAMES.indexOf(dayName);
      let d = new Date(t);
      while (d.getDay() !== targetIdx) d.setDate(d.getDate()+1);
      date = d;
    }
    lastDate = date;
    const planLines = [restFirst||'', ...lines.slice(1)].filter(Boolean);
    const iso = date.toISOString().split('T')[0];
    results.push({
      id: 'd_' + iso,
      date: iso,
      dayLabel: `${dayName}, ${MONTH_NAMES[date.getMonth()]} ${date.getDate()}`,
      plan: planLines.join('\n'),
      note: '',
      completed: false,
      stravaActivities: [],
    });
  }
  return results;
}

// ─── Training: Strava sync ───
async function stravaAccessToken() {
  const refresh = localStorage.getItem('strava_refresh');
  if (!refresh) throw new Error('Connect Strava in Settings first');
  const clientId = localStorage.getItem('strava_client_id') || '252608';
  const clientSecret = localStorage.getItem('strava_client_secret') || '1807ba66a14418a1255ec114bcfaebda8a4440b6';
  const tr = await fetch('https://www.strava.com/oauth/token', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ client_id:clientId, client_secret:clientSecret, refresh_token:refresh, grant_type:'refresh_token' })
  });
  const td = await tr.json();
  if (!td.access_token) throw new Error(td.message || 'Strava authorization failed');
  if (td.refresh_token && td.refresh_token !== refresh) localStorage.setItem('strava_refresh', td.refresh_token);
  return td.access_token;
}

function stravaActivityToObj(a) {
  const meters = a.distance||0;
  const miles = Math.round((meters/1609.344)*100)/100;
  const movingSec = a.moving_time||0;
  let pace = '';
  if (miles>0 && movingSec>0) {
    const paceSecPerMi = movingSec/miles;
    const mm = Math.floor(paceSecPerMi/60), ss = Math.round(paceSecPerMi%60);
    pace = `${mm}:${String(ss).padStart(2,'0')}/mi`;
  }
  return {
    id: a.id, name: a.name, type: a.type || a.sport_type || 'Activity',
    distanceMiles: miles, movingTimeSec: movingSec, elapsedTimeSec: a.elapsed_time||0,
    elevGainFt: Math.round((a.total_elevation_gain||0)*3.28084),
    pace, url: `https://www.strava.com/activities/${a.id}`,
    startDateLocal: a.start_date_local,
  };
}

async function fetchStravaActivities(afterEpochSec) {
  const token = await stravaAccessToken();
  let page=1, all=[];
  while (true) {
    const res = await fetch(`https://www.strava.com/api/v3/athlete/activities?after=${afterEpochSec}&per_page=100&page=${page}`, { headers:{Authorization:'Bearer '+token} });
    const batch = await res.json();
    if (!Array.isArray(batch) || batch.length===0) break;
    all = all.concat(batch);
    if (batch.length<100 || page>5) break;
    page++;
  }
  return all;
}

async function syncStravaToTraining() {
  const pending = state.trainingDays.filter(d => d.date <= today() && (!d.stravaActivities || d.stravaActivities.length===0));
  if (pending.length===0) { toast('Nothing to sync — every logged day already has Strava data','success'); return; }
  const minDate = pending.reduce((m,d)=> d.date<m?d.date:m, pending[0].date);
  const afterEpoch = Math.floor(new Date(minDate+'T00:00:00').getTime()/1000) - 86400;
  const activities = await fetchStravaActivities(afterEpoch);
  const byDate = {};
  activities.forEach(a=>{
    const d = (a.start_date_local||'').slice(0,10);
    if (!d) return;
    (byDate[d]=byDate[d]||[]).push(stravaActivityToObj(a));
  });
  let matchedCount=0;
  const updated = state.trainingDays.map(day=>{
    if (byDate[day.date] && byDate[day.date].length && (!day.stravaActivities || day.stravaActivities.length===0)) {
      matchedCount++;
      return {...day, stravaActivities: byDate[day.date], completed:true};
    }
    return day;
  });
  const {sha} = await fetchTraining();
  await saveTrainingJson(updated, sha);
  state.trainingDays = updated;
  toast(matchedCount>0 ? `Linked Strava activities for ${matchedCount} day(s)` : 'Synced — no matching activities found for pending days','success');
}

async function syncStravaForDay(date) {
  const afterEpoch = Math.floor(new Date(date+'T00:00:00').getTime()/1000) - 3600;
  const activities = await fetchStravaActivities(afterEpoch);
  return activities.filter(a => (a.start_date_local||'').slice(0,10) === date).map(stravaActivityToObj);
}

function attachEvents() {
  const $ = id => document.getElementById(id);

  // PIN
  let pinEntry = '';
  document.querySelectorAll('.pin-key[data-digit]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (pinEntry.length >= 4) return;
      pinEntry += btn.dataset.digit;
      for (let i=0;i<4;i++){const d=$('d'+i);if(d)d.classList.toggle('filled',i<pinEntry.length);}
      if (pinEntry.length===4) {
        if (pinEntry==='1690') {
          sessionStorage.setItem('unlocked','1');
          if (!state.token){state.screen='setup';render();}else{loadAndShowList();}
        } else {
          const err=$('pinError');if(err)err.textContent='Wrong PIN, try again';
          setTimeout(()=>{pinEntry='';for(let i=0;i<4;i++){const d=$('d'+i);if(d)d.classList.remove('filled');}if(err)err.textContent='';},800);
        }
      }
    });
  });
  const pinDel=$('pinDel');
  if(pinDel)pinDel.addEventListener('click',()=>{if(pinEntry.length>0){pinEntry=pinEntry.slice(0,-1);for(let i=0;i<4;i++){const d=$('d'+i);if(d)d.classList.toggle('filled',i<pinEntry.length);}}});

// ─── Photo management ───
let removedPhotos = [];
let focalPoints = {}; // {filename: 'top'|'center'|'bottom'|'left'|'right'}
let imagePlacements = {}; // {filename: paragraphIndex} — which paragraph a non-cover photo follows

function countParagraphs(bodyText) {
  return (bodyText !== undefined ? bodyText : (document.getElementById('fBody')?.value||''))
    .split(/\n\n+/).map(s=>s.trim()).filter(Boolean).length;
}

function buildPlacementOptions(selected, bodyText) {
  const n = countParagraphs(bodyText);
  const sel = (selected===undefined||selected===null) ? '' : String(selected);
  let opts = `<option value="cover" ${sel==='cover'?'selected':''}>Cover</option>`;
  for (let i=0;i<n;i++) {
    opts += `<option value="${i}" ${sel===String(i)?'selected':''}>After paragraph ${i+1}</option>`;
  }
  opts += `<option value="" ${sel===''?'selected':''}>End of post</option>`;
  return opts;
}

function setPlacement(filename, value) {
  if (value === '') delete imagePlacements[filename];
  else if (value === 'cover') imagePlacements[filename] = 'cover';
  else imagePlacements[filename] = Number(value);
  const wrap = document.querySelector(`[data-existing="${filename}"], [data-newname="${filename}"]`);
  if (wrap) wrap.classList.toggle('is-cover', value === 'cover');
}

function refreshPlacementOptions() {
  document.querySelectorAll('.photo-placement').forEach(sel => {
    const wrap = sel.closest('.photo-thumb-wrap');
    const fname = wrap?.dataset.existing || wrap?.dataset.newname;
    const cur = sel.value;
    sel.innerHTML = buildPlacementOptions(cur);
    if (fname) setPlacement(fname, sel.value);
  });
}

function setFocalPoint(filename, value) {
  focalPoints[filename] = value;
  // Update preview image position
  const wrap = document.querySelector(`[data-existing="${filename}"] img, [data-newname="${filename}"] img`);
  if (wrap) wrap.style.objectPosition = value;
}

function removeExistingPhoto(btn, filename) {
  removedPhotos.push(filename);
  delete focalPoints[filename];
  delete imagePlacements[filename];
  btn.closest('.photo-thumb-wrap').remove();
}

// ─── Category change ───
function handleCatChange(val) {

  if (val === '__new__') {
    if (newField) { newField.style.display='flex'; document.getElementById('newCatInput')?.focus(); }
  } else {

}

function getSelectedCategory() {
  const sel = document.getElementById('fCategory');

    if (newVal) { saveNewCategory(newVal); return newVal; }
    return '';

}

// ─── Handlers ───
function handlePhotoSelect(e) {
  const files = Array.from(e.target.files||[]);
  if(!files.length) return;
  const startIdx = photoFiles.length;
  const grid = document.getElementById('photoGrid');
  const hasCoverAlready = !!(grid && grid.querySelector('.photo-thumb-wrap.is-cover'));
  photoFiles = [...photoFiles, ...files];
  const addBtn = document.getElementById('photoAddBtn');

  // Create a thumbnail slot for every selected file up front, in the order they
  // were picked, so which one defaults to "Cover" doesn't depend on which file's
  // FileReader happens to finish reading first.
  const wraps = files.map((file,i) => {
    const fname = file.name;
    const idx = startIdx+i;
    const isCover = !hasCoverAlready && i===0;
    if (isCover) imagePlacements[fname] = 'cover';
    focalPoints[fname] = 'center';
    const wrap = document.createElement('div');
    wrap.className = 'photo-thumb-wrap' + (isCover?' is-cover':'');
    wrap.dataset.newIdx = idx;
    wrap.dataset.newname = fname;
    wrap.innerHTML = `<img alt="" style="object-position:center;background:var(--surface2);">
      <button class="photo-del" onclick="removeNewPhoto(this,${idx},'${fname}')">&#x00D7;</button>
      <select class="photo-placement" onchange="setPlacement('${fname}',this.value)" style="position:absolute;top:0;left:0;right:0;font-size:9px;padding:2px;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:8px 8px 0 0;text-align:center;">${buildPlacementOptions(isCover?'cover':undefined)}</select>
      <select class="photo-focal" onchange="setFocalPoint('${fname}',this.value)" style="position:absolute;bottom:0;left:0;right:0;font-size:10px;padding:2px;background:rgba(0,0,0,0.7);color:#fff;border:none;border-radius:0 0 8px 8px;text-align:center;">
        <option value="center">Center</option>
        <option value="top">Top</option>
        <option value="bottom">Bottom</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
      </select>`;
    if(addBtn&&grid) grid.insertBefore(wrap,addBtn); else if(grid) grid.appendChild(wrap);
    return wrap;
  });

  files.forEach((file,i) => {
    const reader = new FileReader();
    reader.onload = ev => {
      photoBases[startIdx+i] = ev.target.result.split(',')[1];
      const img = wraps[i].querySelector('img');
      if (img) img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  e.target.value='';
}

function removeNewPhoto(btn,idx,fname) {
  photoFiles=photoFiles.filter((_,i)=>i!==idx);
  photoBases[idx]=null;
  if(fname){delete focalPoints[fname];delete imagePlacements[fname];}
  btn.closest('.photo-thumb-wrap').remove();
}

async function handlePublish() {
  const title=document.getElementById('fTitle')?.value?.trim();
  const category=getSelectedCategory();
  const date=document.getElementById('fDate')?.value?.trim();
  const excerpt=document.getElementById('fExcerpt')?.value?.trim();
  const body=document.getElementById('fBody')?.value?.trim();
  const readTimeVal=document.getElementById('fReadTime')?.value;
  const isFeatured=document.getElementById('featuredToggle')?.classList.contains('on');
  if(!title){toast('Title is required','error');return;}

  const relatedIds=[];
  document.querySelectorAll('.related-item input[type=checkbox]:checked').forEach(cb=>relatedIds.push(cb.value));

  const statusBox=document.getElementById('publishStatus');
  const publishBtn=document.getElementById('publishBtn');
  statusBox.style.display='block';publishBtn.disabled=true;
  publishBtn.innerHTML='<span class="spinner"></span>Publishing&hellip;';

  function setStatus(steps){statusBox.innerHTML=`<div class="status-box">${steps.map(s=>`<div class="status-step"><span>${s.icon}</span> ${s.text}</div>`).join('')}</div>`;}

  try {
    // Build image list: keep existing minus removed, then add new uploads
    const existingImgs = state.editingPost ? (state.editingPost.images||(state.editingPost.image?[state.editingPost.image]:[])) : [];
    let imageNames = existingImgs.filter(f => !removedPhotos.includes(f));
    const newFiles = photoFiles.filter((_,i) => photoBases[i]);
    if(newFiles.length>0){
      setStatus([{icon:'&#x1F504;',text:`Uploading ${newFiles.length} photo(s)&hellip;`},{icon:'&#x23F3;',text:'Updating posts.json&hellip;'}]);
      for(let i=0;i<photoFiles.length;i++){
        if(photoBases[i]){await uploadFile(photoFiles[i].name,photoBases[i]);imageNames.push(photoFiles[i].name);}
      }
    }

    setStatus([{icon:'&#x2705;',text:'Photos uploaded'},{icon:'&#x1F504;',text:'Fetching posts.json&hellip;'}]);
    const {posts,sha}=await fetchPosts();

    const readTime=readTimeVal?parseInt(readTimeVal):estimateReadTime(body);
    const isEdit=!!state.editingPost;
    const mergedPlacement={...(state.editingPost?.imagePlacement||{}), ...imagePlacements};
    const imagePlacementObj={};
    imageNames.forEach(f=>{
      const v=mergedPlacement[f];
      if(v==='cover')imagePlacementObj[f]='cover';
      else if(v!==undefined&&v!==null&&v!=='')imagePlacementObj[f]=Number(v);
    });
    const coverNames=imageNames.filter(f=>imagePlacementObj[f]==='cover');
    const primaryImage=coverNames[0]||imageNames[0]||'';
    const postObj={
      id:isEdit?state.editingPost.id:genId(),
      category:category||'Uncategorized',title,
      excerpt:excerpt||'',
      image:primaryImage,
      images:imageNames,
      videos:getVideoUrls(),
      video:getVideoUrls()[0]||'',  // backward compat
      focalPoints:{...(state.editingPost?.focalPoints||{}), ...focalPoints},
      imagePlacement:imagePlacementObj,
      date:date||today(),readTime,featured:isFeatured,body:body||'',
    };
    if(relatedIds.length>0)postObj.related=relatedIds;

    let updatedPosts;
    if(isEdit){const idx=posts.findIndex(p=>p.id===postObj.id);updatedPosts=[...posts];if(idx>=0)updatedPosts[idx]=postObj;else updatedPosts.unshift(postObj);}
    else updatedPosts=[postObj,...posts];

    setStatus([{icon:'&#x2705;',text:'Photos uploaded'},{icon:'&#x1F504;',text:'Saving posts.json&hellip;'}]);
    await savePostsJson(updatedPosts,sha);
    state.posts=updatedPosts;state.screen='success';render();
  } catch(e){
    toast('Error: '+e.message,'error',5000);
    publishBtn.disabled=false;publishBtn.innerHTML=`&#x1F680; ${state.editingPost?'Update Post':'Publish Post'}`;
    setStatus([{icon:'&#x274C;',text:e.message}]);
  }
}

async function handleDelete() {
  const post=state.editingPost;if(!post)return;
  if(!confirm(`Delete "${post.title}"?`))return;
  try {
    const {posts,sha}=await fetchPosts();
    await savePostsJson(posts.filter(p=>p.id!==post.id),sha);
    state.posts=state.posts.filter(p=>p.id!==post.id);
    state.editingPost=null;state.screen='list';render();toast('Post deleted','success');
  } catch(e){toast('Delete failed: '+e.message,'error');}
}

// ─── Init ───
async function loadAndShowList() {
  state.screen='loading';render();
  try {
    const {posts}=await fetchPosts();
    // Sort newest first by date — handle invalid/missing dates gracefully
    const parseDate = d => {
      if (!d) return 0;
      const t = new Date(d).getTime();
      return isNaN(t) ? 0 : t;  // unparseable dates (e.g. "Summer") sort to bottom
    };
    state.posts=posts.slice().sort((a,b) => parseDate(b.date) - parseDate(a.date));
    state.screen='list';
  }
  catch(e){toast('Failed to load posts: '+e.message,'error',5000);state.screen='list';state.posts=[];}
  render();
}

async function loadAndShowTraining() {
  state.screen='loading';render();
  try {
    const {days}=await fetchTraining();
    state.trainingDays=days;
  }
  catch(e){toast('Failed to load training log: '+e.message,'error',5000);state.trainingDays=state.trainingDays||[];}
  state.screen='training';
  render();
}

async function init() {
  if(location.hash){
    const params=new URLSearchParams(location.hash.slice(1));
    if(params.get('t')){state.token=params.get('t');localStorage.setItem('gh_token',state.token);}
    if(params.get('a')){state.anthropicKey=params.get('a');localStorage.setItem('anthropic_key',state.anthropicKey);}
    history.replaceState(null,'',location.pathname+location.search);
  }
  if(!sessionStorage.getItem('unlocked')){state.screen='pin';render();return;}
  if(!state.token){state.screen='setup';render();}
  else await loadAndShowList();
}

init();
</script>
